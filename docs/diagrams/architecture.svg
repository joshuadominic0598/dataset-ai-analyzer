<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title description">
<title id="title">Analytic Brain architecture</title>
<desc id="description">One to five CSV snapshots become immutable local SQLite inputs and measured evidence. A bounded AI analyst uses read-only SQL, field profiles, and optional text search with Ollama, Gemini, OpenAI, or Groq. Reports, conversations, optional vectors, and run traces stay in SQLite. Cloud analysis and text embeddings require the appropriate user choices.</desc>
